<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Generar hash admin</title><style>body{font-family:Segoe UI,Arial;padding:30px;max-width:760px;margin:auto}input,button,textarea{width:100%;padding:10px;margin:8px 0}</style></head><body><h1>Generar SHA-256 para contraseña admin</h1><p>Funciona localmente. No envía la contraseña a ningún sitio.</p><input id="p" type="password" placeholder="Contraseña"><button id="b">Generar hash</button><textarea id="o" rows="4" readonly></textarea><script>async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}b.onclick=async()=>o.value=await sha256(p.value)</script></body></html>
