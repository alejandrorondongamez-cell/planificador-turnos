<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Ops - Shift Planner Pro v3.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root { --shift-morn: #e3f2fd; --shift-morn-text: #0d47a1; --shift-aft: #fff3e0; --shift-aft-text: #e65100; --holiday-bg: #fff5f5; --danger-color: #dc3545; }
        body { background-color: #f4f6f9; font-size: 0.85rem; }
        .sidebar { background: white; border-right: 1px solid #dee2e6; height: 100vh; position: sticky; top: 0; overflow-y: auto; }
        .calendar-table { table-layout: fixed; background: white; border-collapse: separate; border-spacing: 0; width: 100%; border: 1px solid #dee2e6; }
        .calendar-table th { background: #f8f9fa; text-align: center; padding: 8px; border: 1px solid #dee2e6; }
        .calendar-cell { height: 125px; border: 1px solid #dee2e6; padding: 4px; vertical-align: top; transition: 0.2s; position: relative; overflow: hidden; }
        .calendar-cell:hover { background-color: #f1f3f5; cursor: pointer; }
        .day-num { font-weight: bold; font-size: 1rem; }
        .badge-shift { display: block; padding: 2px 5px; border-radius: 3px; margin-bottom: 2px; font-size: 0.65rem; font-weight: 500; border-left: 3px solid transparent; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .m-shift { background: var(--shift-morn); color: var(--shift-morn-text); border-left-color: var(--shift-morn-text); }
        .t-shift { background: var(--shift-aft); color: var(--shift-aft-text); border-left-color: var(--shift-aft-text); }
        .v-shift { background: #eee; color: #666; border-left-color: #999; font-style: italic; }
        .rule-violation { border: 2px solid var(--danger-color) !important; background-color: #fff8f8 !important; }
        .holiday-cell { background-color: var(--holiday-bg); }
        .holiday-label { font-size: 0.6rem; color: #d32f2f; font-weight: bold; display: block; }
        @media print { .no-print { display: none !important; } .container-fluid { width: 100% !important; } }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 sidebar p-3 no-print">
            <h5 class="text-primary mb-4"><i class="bi bi-people-fill me-2"></i>IT Team <span class="badge bg-dark">v3.1</span></h5>
            
            <div class="d-grid gap-2 mb-4">
                <button class="btn btn-primary btn-sm" onclick="exportData()">
                    <i class="bi bi-cloud-upload me-2"></i>Guardar Cambios
                </button>
                <button class="btn btn-outline-secondary btn-sm" onclick="window.print()">
                    <i class="bi bi-printer me-2"></i>Imprimir PDF
                </button>
            </div>

            <h6>Equipo (Días restantes)</h6>
            <div id="team-list" class="list-group list-group-flush small mb-4"></div>

            <div class="alert alert-info small">
                <i class="bi bi-info-circle me-2"></i>Haz clic en un día para editar turnos de los técnicos.
            </div>
        </nav>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 id="current-month-label" class="mb-0">Mes Año</h2>
                <div class="btn-group no-print">
                    <button class="btn btn-outline-primary" onclick="changeMonth(-1)"><i class="bi bi-chevron-left"></i> Anterior</button>
                    <button class="btn btn-primary" onclick="goToToday()">Hoy</button>
                    <button class="btn btn-outline-primary" onclick="changeMonth(1)">Siguiente <i class="bi bi-chevron-right"></i></button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="calendar-table">
                    <thead>
                        <tr>
                            <th>Lunes</th><th>Martes</th><th>Miércoles</th><th>Jueves</th><th>Viernes</th><th>Sábado</th><th>Domingo</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-body"></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title" id="editModalLabel">Asignación de Técnicos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-4">
                        <label class="fw-bold text-primary border-bottom w-100 mb-2">Mañana (08-17h)</label>
                        <div id="morn-selectors"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="fw-bold text-warning border-bottom w-100 mb-2">Tarde (15-24h)</label>
                        <div id="aft-selectors"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="fw-bold text-secondary border-bottom w-100 mb-2">Vacaciones / OFF</label>
                        <div id="vac-selectors"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary w-100" onclick="saveDayChanges()">Aplicar Cambios</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="exportModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header"><h5>Guardar Cambios en GitHub</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <p>Copia este código y pégalo en tu archivo <code>data/planificacion.json</code>:</p>
                <textarea id="json-output" class="form-control" rows="10" readonly style="font-family: monospace; font-size: 11px;"></textarea>
            </div>
            <div class="modal-footer"><button class="btn btn-success" onclick="copyToClipboard()">Copiar al Portapapeles</button></div>
        </div>
    </div>
</div>

<script>
// --- NUEVA LISTA DE TÉCNICOS ---
const team = [
    { id: 1, name: "Max Sendra", vac_total: 22, vac_used: 0 },
    { id: 2, name: "Carlos Guerrero", vac_total: 22, vac_used: 0 },
    { id: 3, name: "Alejandro G. Torres", vac_total: 22, vac_used: 0 },
    { id: 4, name: "Sergio de la Casa Redondo", vac_total: 22, vac_used: 0 },
    { id: 5, name: "Alejandro G. Valdes", vac_total: 22, vac_used: 0 },
    { id: 6, name: "Hector Adarbe", vac_total: 22, vac_used: 0 },
    { id: 7, name: "Pablo Terron", vac_total: 22, vac_used: 0 },
    { id: 8, name: "Alejandro Lopez", vac_total: 22, vac_used: 0 }
];

let viewDate = new Date(); 
let selectedDateKey = "";
let schedule = JSON.parse(localStorage.getItem('shiftData')) || {};
const holidays = { "2026-05-01": "Día del Trabajo", "2026-05-15": "San Isidro", "2026-12-25": "Navidad" };

function renderCalendar() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    document.getElementById('current-month-label').innerText = 
        new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(viewDate).toUpperCase();

    const body = document.getElementById('calendar-body');
    body.innerHTML = '';
    
    let rows = '<tr>';
    let startOffset = firstDay === 0 ? 6 : firstDay - 1; 
    
    for(let i=0; i < startOffset; i++) rows += '<td class="calendar-cell bg-light"></td>';

    for(let d=1; d <= daysInMonth; d++) {
        let dateKey = `${year}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
        const dayData = schedule[dateKey] || { m: [], a: [], v: [] };
        const isHoliday = holidays[dateKey];
        
        const realM = dayData.m.filter(id => !dayData.v.includes(id)).length;
        const realA = dayData.a.filter(id => !dayData.v.includes(id)).length;
        const hasError = realM < 3 || realA < 2;

        rows += `
            <td class="calendar-cell ${hasError ? 'rule-violation' : ''} ${isHoliday ? 'holiday-cell' : ''}" onclick="openEdit('${dateKey}')">
                <div class="d-flex justify-content-between">
                    <span class="day-num">${d}</span>
                    ${hasError ? '<i class="bi bi-exclamation-circle-fill text-danger"></i>' : ''}
                </div>
                ${isHoliday ? `<span class="holiday-label">${isHoliday}</span>` : ''}
                <div class="mt-1">
                    ${dayData.m.map(id => `<span class="badge-shift m-shift">${team.find(t=>t.id===id).name}</span>`).join('')}
                    ${dayData.a.map(id => `<span class="badge-shift t-shift">${team.find(t=>t.id===id).name}</span>`).join('')}
                    ${dayData.v.map(id => `<span class="badge-shift v-shift">OFF: ${team.find(t=>t.id===id).name}</span>`).join('')}
                </div>
            </td>`;
        
        if ((d + startOffset) % 7 === 0) rows += '</tr><tr>';
    }
    body.innerHTML = rows + '</tr>';
    renderTeamList();
}

function renderTeamList() {
    document.getElementById('team-list').innerHTML = team.map(p => `
        <div class="list-group-item px-0 py-1 d-flex justify-content-between align-items-center">
            <span title="${p.name}">${p.name}</span>
            <span class="badge bg-light text-dark border">${p.vac_total - p.vac_used}d</span>
        </div>
    `).join('');
}

function openEdit(dateKey) {
    selectedDateKey = dateKey;
    const dayData = schedule[dateKey] || { m: [], a: [], v: [] };
    const generateChecks = (type) => team.map(p => `
        <div class="form-check small">
            <input class="form-check-input" type="checkbox" value="${p.id}" id="${type}-${p.id}" ${dayData[type].includes(p.id) ? 'checked' : ''}>
            <label class="form-check-label">${p.name}</label>
        </div>
    `).join('');
    document.getElementById('morn-selectors').innerHTML = generateChecks('m');
    document.getElementById('aft-selectors').innerHTML = generateChecks('a');
    document.getElementById('vac-selectors').innerHTML = generateChecks('v');
    new bootstrap.Modal(document.getElementById('editModal')).show();
}

function saveDayChanges() {
    const getValues = (type) => Array.from(document.querySelectorAll(`input[id^="${type}-"]:checked`)).map(el => parseInt(el.value));
    schedule[selectedDateKey] = { m: getValues('m'), a: getValues('a'), v: getValues('v') };
    localStorage.setItem('shiftData', JSON.stringify(schedule));
    renderCalendar();
    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
}

function changeMonth(offset) { viewDate.setMonth(viewDate.getMonth() + offset); renderCalendar(); }
function goToToday() { viewDate = new Date(); renderCalendar(); }
function exportData() {
    document.getElementById('json-output').value = JSON.stringify(schedule, null, 2);
    new bootstrap.Modal(document.getElementById('exportModal')).show();
}
function copyToClipboard() {
    const ta = document.getElementById('json-output');
    ta.select();
    document.execCommand('copy');
    alert("Copiado. Pégalo en data/planificacion.json");
}
document.addEventListener('DOMContentLoaded', renderCalendar);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
